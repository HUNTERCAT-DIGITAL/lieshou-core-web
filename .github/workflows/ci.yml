name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # —— 类型检查 + 依赖契约验证 ——
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile --force
      - name: Typecheck
        run: pnpm typecheck
