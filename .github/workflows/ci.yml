name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # —— 类型检查（模拟消费方 workspace：clone 共享仓 + 临时 workspace）——
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - name: 模拟消费方 workspace（clone 共享仓）
        run: |
          mkdir -p open
          for u in contract-api contract-types contract-config ui; do
            git clone --depth 1 https://github.com/HUNTERCAT-DIGITAL/lieshou-$u.git open/$u 2>/dev/null
          done
          printf 'packages:\n  - "."\n  - "open/*"\n' > pnpm-workspace.yaml
      - name: 安装依赖（workspace 解析）
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
